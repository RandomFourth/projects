name: MTG box prices

# Pulls TCGplayer price history, commits the data, and publishes
# the dashboard to GitHub Pages every 6 hours. The dashboard's Refresh
# button starts it on demand through workflow_dispatch.
on:
  schedule:
    - cron: "30 14,18,23,2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "mtg-box-prices/index.html"
      - "mtg-box-prices/manifest.webmanifest"
      - "mtg-box-prices/icons/**"
      - "mtg-box-prices/scripts/**"
      - "mtg-box-prices/config/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mtg-box-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.on }}
    steps:
      # Check out the branch tip, not the triggering commit, so a run queued
      # behind another one still sees that run's data commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull prices
        working-directory: mtg-box-prices
        run: python3 scripts/update_prices.py --sets 10

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mtg-box-prices/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update MTG box prices $(date -u +%Y-%m-%d)"
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}"
            git push
          fi

      # Publishing only happens once GitHub Pages is turned on in the repo
      # settings. Until then the data still updates and the run passes.
      - name: Check whether GitHub Pages is on
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is off, so the dashboard was not published. The price data was still updated."
          fi

      - if: steps.pages.outputs.on == 'true'
        uses: actions/configure-pages@v5

      - if: steps.pages.outputs.on == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: mtg-box-prices

  deploy:
    needs: update
    if: needs.update.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
